name: release

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Please enter your github name'
        required: true
      email:
        description: 'Please enter your github email'
        required: true
      version:
        description: 'Release version (auto increments custom/shjw; explicit version required for other branches)'
        required: false
        default: 'auto'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  readyGo:

    runs-on: ubuntu-latest

    env: 
      PUBLISH_OPTS: ${{ github.ref_name == 'v4' && '--verbose' || '--verbose --tag=alpha' }}
      VERSION: ${{ github.event.inputs.version }}
      NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v2
        with:
          node-version: 16.13.1
          registry-url: https://registry.npmjs.org/
          
      - name: resolve release version
        run: node scripts/resolve-release-version.js

      - name: before scripts
        run: |
          echo "Current branch: $GITHUB_REF_NAME"
          echo "Current publish version: $VERSION"
      
      - name: set git config
        env:
          RELEASE_EMAIL: ${{ github.event.inputs.email }}
          RELEASE_NAME: ${{ github.event.inputs.name }}
        run: |
          git config --global user.email "$RELEASE_EMAIL"
          git config --global user.name "$RELEASE_NAME"
          
      - name: install global packages
        run: |
          npm install -g lerna@4.0.0
          npm ci

      - name: lint codes
        run: |
          npm run lint

      - name: update version
        run: |
          if [ "$(node -p "require('./lerna.json').version")" != "$VERSION" ]; then
            lerna version "$VERSION" --yes --no-push
          fi
          test "$(node -p "require('./packages/guard-core-v4/package.json').version")" = "$VERSION"

      - name: build core
        run: |
          npm run build:core
          npm run transfer-packages

      - name: persist release version
        run: bash scripts/push-release.sh

      - name: release official
        if: ${{ github.ref_name == 'v4' }}
        run: |
          npm config set //registry.npmjs.org/:_authToken=$NPM_AUTH_TOKEN
          npm run release type=official "version=$VERSION"
          echo "release:official successfully 🚀"
          
      - name: release alpha
        if: ${{ github.ref_name != 'v4' }}
        run: |
          npm config set //registry.npmjs.org/:_authToken=$NPM_AUTH_TOKEN
          npm run release type=alpha "version=$VERSION"
          echo "release:alpha successfully 🚀"

      - name: push release metadata
        run: bash scripts/push-release.sh

      - name: upload oss
        run: |
          npm run oss accessKeyId=$OSS_KEY_ID accessKeySecret=$OSS_KEY_SECRET
        env:
          OSS_KEY_ID: ${{ secrets.OSS_KEY_ID }}
          OSS_KEY_SECRET: ${{ secrets.OSS_KEY_SECRET }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
