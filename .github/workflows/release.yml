name: release

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Please enter your github name'
        required: true
      email:
        description: 'Please enter your github email'
        required: true
      version:
        description: 'Please enter your release version'
        required: true

permissions:
  contents: write
        
jobs:

  readyGo:

    runs-on: ubuntu-latest

    env: 
      PUBLISH_OPTS: ${{ github.ref_name == 'v4' && '--verbose' || '--verbose --tag=alpha' }}
      VERSION: ${{ github.event.inputs.version }}
      NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v2
        with:
          node-version: 16.13.1
          registry-url: https://registry.npmjs.org/
          
      - name: before scripts
        run: |
          echo "Current branch: ${{ github.ref_name }}"
          echo "Current publish version: ${{ github.event.inputs.version }}"
          echo "Current user.name: ${{ github.event.inputs.name }}"
          echo "Current user.email: ${{ github.event.inputs.email }}"
      
      - name: set git config
        run: |
          git config --global user.email ${{ github.event.inputs.email }}
          git config --global user.name ${{ github.event.inputs.name }}
          
      - name: install global packages
        run: |
          npm install -g lerna@4.0.0
          npm ci

      - name: lint codes
        run: |
          npm run lint

      - name: update version
        run: |
          NORMALIZED_VERSION="${VERSION#v}"
          CURRENT_VERSION="$(node -p "require('./lerna.json').version")"
          if [ "$CURRENT_VERSION" != "$NORMALIZED_VERSION" ]; then
            lerna version "$NORMALIZED_VERSION" --yes --no-push
          else
            echo "Version $NORMALIZED_VERSION is already committed"
          fi
          test "$(node -p "require('./packages/guard-core-v4/package.json').version")" = "$NORMALIZED_VERSION"

      - name: build core
        run: |
          npm run build:core
          npm run transfer-packages

      - name: persist release version
        run: |
          git push origin "HEAD:${GITHUB_REF_NAME}" --follow-tags

      - name: release official
        if: ${{ github.ref_name == 'v4' }}
        run: |
          npm config set //registry.npmjs.org/:_authToken=$NPM_AUTH_TOKEN
          npm run release type=official version=$VERSION
          echo "release:official successfully 🚀"
          
      - name: release alpha
        if: ${{ github.ref_name != 'v4' }}
        run: |
          npm config set //registry.npmjs.org/:_authToken=$NPM_AUTH_TOKEN
          npm run release type=alpha version=$VERSION
          echo "release:alpha successfully 🚀"

      - name: push release metadata
        run: |
          git push origin "HEAD:${GITHUB_REF_NAME}" --follow-tags

      - name: upload oss
        run: |
          npm run oss accessKeyId=$OSS_KEY_ID accessKeySecret=$OSS_KEY_SECRET
        env:
          OSS_KEY_ID: ${{ secrets.OSS_KEY_ID }}
          OSS_KEY_SECRET: ${{ secrets.OSS_KEY_SECRET }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
